<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boatrace Lab</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E4F63">
<style>
:root{--bg:#F2F5F6;--sf:#fff;--sf2:#E8EEF0;--ink:#17262C;--ink2:#4E6068;--line:#D3DCE0;--acc:#0E4F63;--acc2:#6FB7CC;--buoy:#D9581F;--ok:#2E7D5B;--okbg:#E4F2EA;--ng:#B23A3A;--ngbg:#F8E5E5;--warnbg:#FFF4D6;--warn:#8A5A00;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--mode:var(--acc);--modebg:#E3F0F4}
@media(prefers-color-scheme:dark){:root{--bg:#0F181C;--sf:#162228;--sf2:#1E2D34;--ink:#E3ECF0;--ink2:#9DB0B8;--line:#2A3A42;--acc:#6FB7CC;--acc2:#0E4F63;--buoy:#F0844E;--ok:#7CCBA3;--okbg:#16302A;--ng:#F08080;--ngbg:#3A1C1C;--warnbg:#3A2E10;--warn:#F2C766;--modebg:#12313A}body[data-mode=std]{--mode:#F0A46E;--modebg:#3A2A1E}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;padding:0 12px calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:3px solid var(--mode)}
header h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.02em;white-space:nowrap}header .sub{font-size:11px;color:var(--ink2);font-family:var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modeTog{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto;background:var(--sf)}.modeTog button{font:inherit;font-size:12px;font-weight:700;line-height:1.15;border:0;background:none;color:var(--ink2);padding:4px 10px;min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center}.modeTog button small{font-size:9px;font-weight:400;opacity:.85}.modeTog button.on{background:var(--mode);color:#fff}
.modeBar{display:flex;flex-direction:column;align-items:stretch;gap:8px;background:var(--modebg);border-left:4px solid var(--mode);border-radius:10px;padding:10px 12px;margin:10px 0}.modeBar .t{flex:1;min-width:0;width:100%}.modeBar .btns{display:flex;gap:6px;flex-wrap:wrap}.modeBar .t b{color:var(--mode);font-size:15px}.modeBar .t small{display:block;color:var(--ink2);font-size:12px}.modeBar button{flex:0 0 auto;font:inherit;font-size:12px;border:1px solid var(--mode);background:var(--sf);color:var(--mode);border-radius:8px;padding:6px 10px;min-height:36px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stg .st{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;position:relative}.stg .st.wide{grid-column:1/-1;display:flex;align-items:center;gap:10px}.stg .st b.nm{font-size:16px}.stg .st .g{font-size:11px;color:var(--ink2);margin-left:4px}.stg .st .ln{font-size:12px;color:var(--ink2);margin-top:2px}.stg .st .rec{position:absolute;right:10px;top:9px;font-family:var(--mono);font-size:12px;color:#fff;background:var(--mode);border-radius:999px;padding:1px 8px}.stg .st.done{opacity:.75}.stg .st .pl{font-family:var(--mono);font-size:12px}.stg .st .pl.pos{color:var(--ok)}.stg .st .pl.neg{color:var(--ng)}
.crumb{display:flex;align-items:center;gap:8px;margin:6px 0 2px}.crumb button{font:inherit;font-size:13px;border:0;background:none;color:var(--acc);padding:6px 4px 6px 0;min-height:36px}.crumb b{font-size:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--ink2);font:inherit;font-size:11px;padding:8px 0 6px;min-height:52px}nav button.on{color:var(--acc);font-weight:700}nav button span{display:block;font-size:20px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}.kpi b{display:block;font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;color:var(--mode)}.kpi span{font-size:11px;color:var(--ink2)}
.kpi b.pos{color:var(--ok)}.kpi b.neg{color:var(--ng)}
h2{font-size:15px;margin:18px 0 6px}h3{font-size:14px;margin:12px 0 4px;color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border-bottom:0}.row .t{flex:1;min-width:0}.row .t b{font-size:15px}.row .t small{display:block;color:var(--ink2);font-size:12px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-family:var(--mono)}
.pill.buy{background:var(--mode);color:#fff;border-color:transparent}.pill.skip{background:var(--sf2);color:var(--ink2)}.pill.hit{background:var(--okbg);color:var(--ok);border-color:transparent}.pill.miss{background:var(--ngbg);color:var(--ng);border-color:transparent}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.bar{height:6px;background:var(--sf2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mode)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.muted{color:var(--ink2);font-size:12px}.right{text-align:right}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;color:var(--ink2);font-weight:600}td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}table.wide td:first-child,table.wide th:first-child{white-space:nowrap}
#pgt td,#pgt th{white-space:nowrap}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sel .pt{background:var(--sf2);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap}.sel .pt.hole{border-left:3px solid var(--buoy)}.sel .pt.won{outline:2px solid var(--ok)}
.pt small{color:var(--ink2);font-size:11px}
.form{font-family:var(--mono);font-size:15px}.form .fl{display:grid;grid-template-columns:auto auto 1fr auto;gap:0 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.form .fl:last-child{border:0}
.form .arrow{color:var(--ink2)}.form .thirds span{display:inline-block;margin-right:6px}.form .thirds span.won{color:var(--ok);font-weight:800;text-decoration:underline}.form .amt{color:var(--ink2);font-size:12px;text-align:right}
.boat{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.boat:last-child{border:0}.lane{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.l1{background:#fff;color:#222;border:1px solid #999}.l2{background:#222}.l3{background:#d33}.l4{background:#28a}.l5{background:#dc0;color:#222}.l6{background:#2a2}
.lanes{display:flex;gap:4px}.lanes .lane{width:26px;height:26px;font-size:13px;border-radius:5px}
button.btn{font:inherit;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;min-height:40px}button.btn.ghost{background:none;color:var(--acc)}button.btn:disabled{opacity:.5}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--sf);color:var(--ink);width:100%}
label{display:block;font-size:13px;color:var(--ink2);margin:8px 0}label input,label select{margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}.tabs button{flex:0 0 auto;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--sf);color:var(--ink2);padding:6px 10px;border-radius:999px;min-height:32px}.tabs button.on{background:var(--acc);color:#fff;border-color:transparent}
.filt{position:sticky;top:var(--hdr,52px);z-index:4;background:var(--bg);padding:4px 0 6px;box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
.filt .rng{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--ink2)}.filt .rng input[type=range]{padding:0;height:28px}
.judge{border-left:4px solid var(--acc);padding-left:10px}.judge.ok{border-color:var(--ok)}.judge.ng{border-color:var(--buoy)}
details summary{cursor:pointer;color:var(--acc);font-size:13px}
details.sec{margin:10px 0}details.sec>summary{font-size:15px;font-weight:700;color:var(--ink);padding:10px 12px;background:var(--sf);border:1px solid var(--line);border-radius:10px;list-style:none;display:flex;justify-content:space-between;align-items:center}details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::after{content:"＋";color:var(--ink2);font-weight:400}details.sec[open]>summary::after{content:"－"}details.sec[open]>summary{border-radius:10px 10px 0 0}details.sec>.card{margin-top:0;border-top:0;border-radius:0 0 10px 10px}
.warnTxt{color:var(--ng)}
.fresh{font-size:12px;color:var(--ink2);margin:6px 0 2px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.fresh.warn{background:var(--warnbg);color:var(--warn);padding:6px 10px;border-radius:8px}
.offline{background:var(--warnbg);color:var(--warn);font-size:12px;padding:6px 10px;border-radius:8px;margin:8px 0;display:none}
.login{max-width:320px;margin:80px auto;text-align:center}
pre.md{white-space:pre-wrap;font-size:12px;background:var(--sf2);padding:10px;border-radius:8px;overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--modebg);color:var(--mode);border:1px solid var(--mode);margin:2px 4px 0 0;white-space:nowrap}
.tag.solid{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.tag.pre{font-weight:700}
.big{font-size:22px;font-family:var(--mono);font-weight:800}
.buyrow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}.buyrow:last-child{border:0}
.buyrow .h{font-size:15px;font-weight:700}.buyrow .h small{font-weight:400;color:var(--ink2);margin-left:6px}
.buyrow .p{font-family:var(--mono);font-size:13px;color:var(--ink)}.buyrow .r{text-align:right;white-space:nowrap}
.buyrow.soon .h{color:var(--buoy)}.buyrow.done{opacity:.85}
.vs{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 10px;font-size:13px;align-items:baseline}.vs .k{color:var(--ink2);font-size:12px}.vs .v{font-family:var(--mono);font-weight:700;text-align:right}.vs .hd{font-size:11px;color:var(--ink2);text-align:right}
.empty{padding:14px 4px;color:var(--ink2);font-size:13px}
</style>
</head>
<body>
<div class="app" id="app">
  <header><h1>🚤 Lab</h1><div class="sub" id="hdr"></div><div class="modeTog" id="modeTog"><button data-m="ana">穴狙い<small>3連単</small></button><button data-m="katai">堅い予想<small>3連単</small></button><button data-m="place">複勝・単勝<small>的中率重視</small></button></div></header>
  <div class="offline" id="offline">オフライン表示（最終取得時点のデータ）</div>
  <main id="main"></main>
</div>
<nav>
  <button data-v="home"><span>🏠</span>ホーム</button>
  <button data-v="races"><span>📋</span>レース</button>
  <button data-v="stats"><span>📈</span>成績</button>
  <button data-v="settings"><span>⚙️</span>設定</button>
</nav>
<script>
// ============================================================ 基本
const $ = (s, el=document) => el.querySelector(s);
const NOW = () => new Date();
const fmtP = v => v==null ? "–" : (v*100).toFixed(1)+"%";
const fmtY = v => v==null ? "–" : (v>=0?"+":"") + Math.round(v).toLocaleString() + "円";
const fmtN = v => v==null ? "–" : Math.round(v).toLocaleString();
const hhmm = s => s ? s.slice(11,16) : "";
const tm = s => s ? String(s).replace("T"," ").slice(5,16).replace("-","/") : "–";
const fmtLoss = v => v >= 10000 ? `約${(v / 10000).toFixed(1)}万円` : `約${fmtN(v)}円`;
let saved = {}; try { saved = JSON.parse(localStorage.getItem("bl_state") || "{}"); } catch (e) {}
const state = Object.assign({ view: "home", raceId: null, day: null, mode: "ana", rv: "stadiums", statsBy: "month", statsRange: "all",
  f: { stadium: "", dec: "buy" } }, saved);
const MAIN_MODES = ["ana", "katai", "place"];
if (!MAIN_MODES.includes(state.mode)) state.mode = "ana";
function persist() { try { localStorage.setItem("bl_state", JSON.stringify({ mode: state.mode, f: state.f, rv: state.rv, statsBy: state.statsBy })); } catch (e) {} }
const MODE_ROLE = { ana: "ana", katai: "katai", place: "place" };
const MODE_NAME = { ana: "3連単（穴狙い）", katai: "3連単（堅い予想）", place: "複勝・単勝", active: "15点固定（旧）", focused: "絞り込み型（旧）" };
const MODE_ONE = { ana: "市場が荒れると見ているレースだけ、人気20〜40番目の3連単21点を100円ずつ",
  katai: "本線を「当たれば必ず投資額以上」が成り立つ点数まで削って買う（信頼度0.70以上のレースのみ）",
  place: "市場がいちばん確信している艇を1点。複勝は2着以内確率0.90以上、単勝は1着確率0.771以上" };
const REASON = { confidence: "信頼度が基準未満", confidence_low: "信頼度が基準未満", expected_return: "期待回収率が基準未満", incomplete: "データ未取得",
  odds_estimated: "実オッズ未取得", odds_missing: "実オッズ未取得", q_man_low: "市場が荒れると見ていない", q_low: "市場の確信度が基準未満",
  too_few_points: "保証できる点数が3点未満", no_guarantee: "当たっても投資額を下回る", disabled: "設定で停止中" };
const TAGS = { l1_b: "1号艇B級", kado: "4カド条件", l1_ext4: "1号艇 展示T4位以下", rough_stadium: "荒れる場", maezuke: "前づけあり", top1_12: "1番人気12倍以上",
  women_rookie: "女子・ルーキー戦（堅い）", kikaku: "企画レース（堅い）" };
const PRE = new Set(["l1_b", "kado", "l1_ext4"]);
const mq = () => "mode=" + state.mode;
let MODES_CACHE = { key: null, v: null };
async function modesData(day) { const k = day || ""; if (MODES_CACHE.key !== k) MODES_CACHE = { key: k, v: await api("/api/modes" + (day ? "?d=" + day : "")) }; return MODES_CACHE.v; }
async function api(path, opt) {
  const r = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opt || {}));
  $("#offline").style.display = r.headers.get("X-From-Cache") ? "block" : "none";
  if (r.status === 401) { renderLogin(); throw new Error("auth"); }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function go(view, extra, opts) {
  if (view === "race" && state.view !== "race") { state.backView = state.view; state.backScroll = window.scrollY; if (!(opts && opts.pop)) history.pushState({ view: "race" }, ""); }
  state.view = view; Object.assign(state, extra || {}); persist();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  render().then(() => { if (view !== "race" && state.backScroll != null && view === state.backView) { window.scrollTo(0, state.backScroll); state.backScroll = null; } else window.scrollTo(0, 0); });
}
function goBack() { if (history.state && history.state.view === "race") history.back(); else go(state.backView || "races"); }
window.addEventListener("popstate", () => { if (state.view === "race") go(state.backView || "home", {}, { pop: true }); });
function setMode(m) { state.mode = m; MODES_CACHE.key = null; persist(); render(); }
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.v));
document.querySelectorAll("#modeTog button").forEach(b => b.onclick = () => setMode(b.dataset.m));
async function render() {
  document.querySelectorAll("#modeTog button").forEach(b => b.classList.toggle("on", b.dataset.m === state.mode));
  document.body.dataset.mode = state.mode;
  const hdr = document.querySelector("header"); if (hdr) document.documentElement.style.setProperty("--hdr", hdr.offsetHeight + "px");
  const m = $("#main"); m.innerHTML = '<p class="muted">読み込み中…</p>';
  try {
    if (state.view === "home") await renderHome(m);
    else if (state.view === "races") await renderRaces(m);
    else if (state.view === "race") await renderRace(m);
    else if (state.view === "stats") await renderStats(m);
    else if (state.view === "settings") await renderSettings(m);
  } catch (e) { if (e.message !== "auth") m.innerHTML = `<div class="card">エラー: ${e.message}</div>`; }
}
function renderLogin() {
  $("#main").innerHTML = `<div class="login card"><h2>ログイン</h2><input id="pw" type="password" placeholder="パスワード" autocomplete="current-password"><p><button class="btn" id="lg">ログイン</button></p></div>`;
  $("#lg").onclick = async () => { const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }) }); if (r.ok) render(); else alert("パスワードが違います"); };
}
// ============================================================ 共通部品
function modeBar() {
  return `<div class="modeBar"><div class="t"><b>${MODE_NAME[state.mode]}</b><small>${MODE_ONE[state.mode]}</small></div></div>`;
}
function freshLine(u) {
  if (!u) return "";
  if (!u.stale && !u.stuck) return `<p class="muted" style="margin:2px 0 6px">最終取込 ${tm(u.ingest_at)} · 最終予想保存 ${tm(u.predict_at)}</p>`;
  return `<div class="fresh warn"><span><b>⚠ 更新が止まっています</b>（最終取込 ${tm(u.ingest_at)}${u.stale_min != null ? `、${u.stale_min}分前` : ""}）</span>${u.stuck ? `<span>中断: ${u.stuck.job}</span>` : ""}</div>`;
}
function kpi(label, val, cls="") { return `<div class="kpi"><b class="${cls}">${val}</b><span>${label}</span></div>`; }
function tagPills(flags, withSolid=true) {
  const f = flags || {};
  const a = (f.tags || []).map(k => `<span class="tag ${PRE.has(k) ? "pre" : ""}">${PRE.has(k) ? "★" : ""}${TAGS[k] || k}</span>`);
  const b = withSolid ? (f.solid_tags || []).map(k => `<span class="tag solid">⚠ ${TAGS[k] || k}</span>`) : [];
  return a.concat(b).join("");
}
function planOf(r) {
  // 買い目の要約（一覧用）
  const f = r.flags || {};
  if (!r.prediction_id) return "";
  if (r.decision !== "buy") return `<span class="muted">見送り · ${REASON[r.skip_reason] || r.skip_reason || ""}</span>`;
  if (state.mode === "ana") return `${r.n_points}点 ${fmtN(r.stake_plan)}円`;
  if (state.mode === "katai") return `${r.n_points}点 ${fmtN(r.stake_plan)}円${f.min_payout ? ` <small class="muted">当たれば${fmtN(f.min_payout)}円以上</small>` : ""}`;
  const fk = f.fukusho || {}, tn = f.tansho || {};
  return [fk.fired ? `複勝 ${fk.lane}号艇` : null, tn.fired ? `単勝 ${tn.lane}号艇` : null].filter(Boolean).join(" / ") + ` ${fmtN(r.stake_plan)}円`;
}
function resultPill(r) {
  if (r.valid) return `<span class="pill ${r.hit ? "hit" : "miss"}">${r.hit ? "🎯 " + fmtY(r.pnl) : "外れ " + fmtY(r.pnl)}</span>`;
  if (r.trifecta) return `<span class="pill">${r.trifecta}</span>`;
  if (r.closed_at && new Date(r.closed_at) < NOW()) return `<span class="pill warn">結果待ち</span>`;
  return "";
}
function minsTo(s) { return s ? Math.round((new Date(s) - NOW()) / 60000) : null; }
function buyRow(r) {
  const mins = minsTo(r.closed_at), soon = mins != null && mins > 0 && mins <= 15, done = !!r.trifecta || r.valid;
  const when = mins == null ? "" : (mins > 0 && !done ? `締切 ${hhmm(r.closed_at)}${mins <= 60 ? `（あと${mins}分）` : ""}` : `締切 ${hhmm(r.closed_at)}`);
  return `<div class="buyrow ${soon ? "soon" : ""} ${done ? "done" : ""}" onclick="go('race',{raceId:${r.id}})">

  const KEYN = { month: "月", stadium: "場" };
  $("#hdr").textContent = "成績";
  const tbl = (rows, key) => rows.length ? `<div class="card tbl"><table><tr><th>${KEYN[key] || key}</th><th class="n">n</th><th class="n">的中率</th><th class="n">回収率</th><th class="n">損益</th><th class="n">最長連敗</th></tr>${rows.map(r => `<tr><td>${r[key]}</td><td class="n">${r.n}</td><td class="n">${fmtP(r.hit_rate)}</td><td class="n"><b>${fmtP(r.roi)}</b></td><td class="n">${fmtY(r.pnl)}</td><td class="n">${r.max_losing_streak}</td></tr>`).join("")}</table></div>` : `<div class="card muted">まだ記録がありません</div>`;
  m.innerHTML = `${modeBar()}
    <div class="tabs">${[["all", "全期間"], ["m", "今月"], ["w", "直近7日"], ["d", "今日"]].map(([k, l]) => `<button class="${state.statsRange === k ? "on" : ""}" onclick="go('stats',{statsRange:'${k}'})">${l}</button>`).join("")}</div>
    <h2>累計（推奨レース・仮想）</h2><div class="kpis">${kpi("レース", b.n)}${kpi("的中率", fmtP(b.hit_rate))}${kpi("回収率", fmtP(b.roi), (b.roi || 0) >= 1 ? "pos" : "")}</div>
    <div class="kpis" style="margin-top:8px">${kpi("損益", fmtY(b.pnl), b.pnl >= 0 ? "pos" : "neg")}${kpi("最長連敗", (b.max_losing_streak ?? 0) + "R")}${kpi("直近100 回収率", fmtP(s.recent100_buy.roi))}</div>
    <p class="muted">回収率95%区間 ${b.roi_ci ? b.roi_ci.map(fmtP).join("〜") : "–"} · 見送り含む全レース仮想 ${v.n}R 回収率 ${fmtP(v.roi)}</p>
    ${measuredVs(MODE_ROLE[state.mode], md)}
    ${state.mode === "ana" ? tagVerifyCard(md) : ""}
    <h2>月別</h2>${tbl(bm, "month")}<h2>場別</h2>${tbl(bs, "stadium")}`;
}
// ============================================================ 設定
const V_PILL = { ok: "hit", upstream: "warn", wait: "skip", ng: "miss", unknown: "warn" };
const V_TEXT = { ok: "正常", upstream: "上流待ち", wait: "待機中", ng: "異常", unknown: "不明" };
function statusRow(label, verdict, main, note) {
  return `<div class="row" style="cursor:default"><div class="t"><b>${label}</b> <span class="pill ${V_PILL[verdict] || ""}">${V_TEXT[verdict] || verdict}</span><small>${note}</small></div><div class="right mono">${main}</div></div>`;
}
function statusSection(x) {
  if (!x) return "";
  const t = x.today, o = x.odds, f = x.freshness || {}, est = x.predictions.estimated_odds, badJobs = (x.jobs || []).filter(j => j.ok === 0);
  const up = t.upstream && t.upstream.filled != null ? `（上流 ${t.upstream.filled}/${t.upstream.races}）` : "";
  return `<details class="sec" open><summary>システムの状態 <span class="muted">${tm(x.now).slice(6)} 時点</span></summary><div class="card">
    ${statusRow("本日の結果", t.verdict, `${t.results}/${t.races}${up}`, t.note)}
    ${statusRow("公式オッズ（3連単）", o.trifecta ? "ok" : o.verdict, `${o.trifecta}件`, o.trifecta ? "締切6〜12分前に取得" : (o.note || ""))}
    ${statusRow("確定予想", est ? "ng" : (x.predictions.final ? "ok" : "wait"), `${x.predictions.final}件`, est ? `${est}件が推定オッズで作られています` : "実オッズで作成")}
    <p class="muted" style="margin:8px 0 0">${f.stale ? "⚠ 取り込みが15分以上止まっています。" : ""}最終取込 ${tm(f.ingest_at)} · 最終予想 ${tm(f.predict_at)}${f.stuck ? ` · 中断: ${f.stuck.job}` : ""}</p></div>
    <div class="card"><details><summary>直近のジョブ ${badJobs.length ? `<span class="pill miss">失敗${badJobs.length}</span>` : ""}</summary><div class="tbl"><table class="wide"><thead><tr><th>ジョブ</th><th>開始</th><th>結果</th></tr></thead><tbody>
      ${(x.jobs || []).map(j => `<tr><td>${j.job}</td><td class="n">${tm(j.started_at)}</td><td>${j.ok === 1 ? "OK" : (j.ok === 0 ? `<span class="warnTxt">失敗 ${j.error || ""}</span>` : (j.finished_at ? "-" : "実行中/中断"))}</td></tr>`).join("")}</tbody></table></div></details></div></details>`;
}
async function renderSettings(m) {
  const [s, sys, md] = await Promise.all([api("/api/settings"), api("/api/status").catch(() => null), modesData()]);
  const ex = s.extra || {}, mp = md.params || {};
  $("#hdr").textContent = "設定";
  const num = (id, label, v, step, extra="") => `<label>${label}<input id="${id}" type="number" step="${step}" value="${v}" ${extra}></label>`;
  const dl = (mode, label) => `<a class="btn ghost" style="display:inline-block;text-decoration:none;padding:8px 14px;border:1px solid var(--acc);border-radius:8px;margin:4px 6px 4px 0" href="/api/export.csv?mode=${mode}" download>${label}</a>`;
  m.innerHTML = `${statusSection(sys)}
    <details class="sec" open><summary>3モードの条件（値は versioned settings として記録・自動では変わりません）</summary><div class="card">
      <h3 style="margin-top:0">3連単（穴狙い）</h3>
      <div class="two">${num("ana_q", "市場の万舟確率の下限", mp.ana_qman_min, 0.005)}${num("ana_stake", "1点（円）", mp.ana_stake, 100)}</div>
      <div class="two">${num("ana_lo", "人気 何番目から", mp.ana_rank_lo, 1)}${num("ana_hi", "人気 何番目まで", mp.ana_rank_hi, 1)}</div>
      <h3>3連単（堅い予想）</h3>
      <div class="two">${num("k_budget", "1レース予算＝保証する最低払戻（円）", mp.katai_budget, 500)}${num("k_conf", "信頼度の下限", mp.katai_confidence_min, 0.01)}</div>
      <div class="two">${num("k_max", "本線の最大点数", mp.katai_points_max, 1)}${num("k_min", "成立に必要な最小点数", mp.katai_points_min, 1)}</div>
      <h3>複勝・単勝</h3>
      <div class="two">${num("p_fk", "複勝: 市場の2着以内確率の下限", mp.fukusho_q_min, 0.01)}${num("p_tn", "単勝: 市場の1着確率の下限", mp.tansho_q_min, 0.01)}</div>
      ${num("p_stake", "1点（円）", mp.place_stake, 100)}
      <p class="muted">しきい値は確定オッズで決めた値です。締切前オッズでは市場の確信度が低めに出るので、記録が貯まったら締切前基準で見直します。</p>
      <p><button class="btn" id="save" style="width:100%">保存（新しい設定版として記録）</button></p></div></details>
    <details class="sec" open><summary>データの書き出し（CSV）</summary><div class="card"><p class="muted" style="margin-top:0">採点済みの記録。分析を依頼するときはこのファイルを渡してください。</p>
      ${dl("ana", "3連単（穴狙い）")}${dl("katai", "3連単（堅い予想）")}${dl("place", "複勝・単勝")}
      <p class="muted" style="margin:10px 0 4px">旧モード（画面からは外しましたが記録は続いています）</p>${dl("focused", "絞り込み型（旧）")}${dl("std", "15点固定（旧）")}</div></details>
    <details class="sec"><summary>このツールについて</summary><div class="card muted">自動購入はしません。設定は自動で変わりません。予想は締切前に保存され、あとから書き換えられません（追記専用）。見送りレースも仮想で採点します。<br>過去の研究（reports/）: 単勝・複勝プールの歪み、買い方の自動研究、絞り込み型などは記録・API を残したまま画面から外しています。</div></details>`;
  $("#save").onclick = async () => {
    const g = id => +$("#" + id).value;
    const modes = Object.assign({}, mp, { ana_qman_min: g("ana_q"), ana_stake: g("ana_stake"), ana_rank_lo: g("ana_lo"), ana_rank_hi: g("ana_hi"),
      katai_budget: g("k_budget"), katai_confidence_min: g("k_conf"), katai_points_max: g("k_max"), katai_points_min: g("k_min"),
      fukusho_q_min: g("p_fk"), tansho_q_min: g("p_tn"), place_stake: g("p_stake") });
    await api("/api/settings", { method: "PUT", body: JSON.stringify({ extra: Object.assign({}, ex, { modes }) }) });
    MODES_CACHE.key = null; alert("保存しました"); render();
  };
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
go("home");
</script>
