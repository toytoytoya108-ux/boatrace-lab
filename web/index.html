<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boatrace Lab</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E4F63">
<style>
:root{--bg:#F2F5F6;--sf:#fff;--sf2:#E8EEF0;--ink:#17262C;--ink2:#4E6068;--line:#D3DCE0;--acc:#0E4F63;--acc2:#6FB7CC;--buoy:#D9581F;--ok:#2E7D5B;--okbg:#E4F2EA;--ng:#B23A3A;--ngbg:#F8E5E5;--warnbg:#FFF4D6;--warn:#8A5A00;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#0F181C;--sf:#162228;--sf2:#1E2D34;--ink:#E3ECF0;--ink2:#9DB0B8;--line:#2A3A42;--acc:#6FB7CC;--acc2:#0E4F63;--buoy:#F0844E;--ok:#7CCBA3;--okbg:#16302A;--ng:#F08080;--ngbg:#3A1C1C;--warnbg:#3A2E10;--warn:#F2C766}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;padding:0 12px calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid var(--acc)}
header h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.02em;white-space:nowrap}header .sub{font-size:11px;color:var(--ink2);font-family:var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modeTog{display:flex;border:1px solid var(--acc);border-radius:999px;overflow:hidden;flex:0 0 auto}.modeTog button{font:inherit;font-size:12px;border:0;background:none;color:var(--acc);padding:5px 10px;min-height:32px}.modeTog button.on{background:var(--acc);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--ink2);font:inherit;font-size:11px;padding:8px 0 6px;min-height:52px}nav button.on{color:var(--acc);font-weight:700}nav button span{display:block;font-size:20px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}.kpi b{display:block;font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;color:var(--acc)}.kpi span{font-size:11px;color:var(--ink2)}
.kpi b.pos{color:var(--ok)}.kpi b.neg{color:var(--ng)}
h2{font-size:15px;margin:18px 0 6px}h3{font-size:14px;margin:12px 0 4px;color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border-bottom:0}.row .t{flex:1;min-width:0}.row .t b{font-size:15px}.row .t small{display:block;color:var(--ink2);font-size:12px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-family:var(--mono)}
.pill.buy{background:var(--acc);color:#fff;border-color:transparent}.pill.skip{background:var(--sf2);color:var(--ink2)}.pill.hit{background:var(--okbg);color:var(--ok);border-color:transparent}.pill.miss{background:var(--ngbg);color:var(--ng);border-color:transparent}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.bar{height:6px;background:var(--sf2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.muted{color:var(--ink2);font-size:12px}.right{text-align:right}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;color:var(--ink2);font-weight:600}td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sel .pt{background:var(--sf2);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap}.sel .pt.hole{border-left:3px solid var(--buoy)}.sel .pt.won{outline:2px solid var(--ok)}
.pt small{color:var(--ink2);font-size:11px}
.form{font-family:var(--mono);font-size:15px}.form .fl{display:grid;grid-template-columns:auto auto 1fr auto;gap:0 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.form .fl:last-child{border:0}
.form .arrow{color:var(--ink2)}.form .thirds span{display:inline-block;margin-right:6px}.form .thirds span.won{color:var(--ok);font-weight:800;text-decoration:underline}.form .amt{color:var(--ink2);font-size:12px;text-align:right}
.boat{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.boat:last-child{border:0}.lane{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.l1{background:#fff;color:#222;border:1px solid #999}.l2{background:#222}.l3{background:#d33}.l4{background:#28a}.l5{background:#dc0;color:#222}.l6{background:#2a2}
.lanes{display:flex;gap:4px}.lanes .lane{width:26px;height:26px;font-size:13px;border-radius:5px}
button.btn{font:inherit;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;min-height:40px}button.btn.ghost{background:none;color:var(--acc)}button.btn:disabled{opacity:.5}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--sf);color:var(--ink);width:100%}
label{display:block;font-size:13px;color:var(--ink2);margin:8px 0}label input,label select{margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}.tabs button{flex:0 0 auto;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--sf);color:var(--ink2);padding:6px 10px;border-radius:999px;min-height:32px}.tabs button.on{background:var(--acc);color:#fff;border-color:transparent}
.filt{position:sticky;top:var(--hdr,52px);z-index:4;background:var(--bg);padding:4px 0 6px;box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
.filt .rng{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--ink2)}.filt .rng input[type=range]{padding:0;height:28px}
.judge{border-left:4px solid var(--acc);padding-left:10px}.judge.ok{border-color:var(--ok)}.judge.ng{border-color:var(--buoy)}
details summary{cursor:pointer;color:var(--acc);font-size:13px}
.offline{background:var(--warnbg);color:var(--warn);font-size:12px;padding:6px 10px;border-radius:8px;margin:8px 0;display:none}
.login{max-width:320px;margin:80px auto;text-align:center}
pre.md{white-space:pre-wrap;font-size:12px;background:var(--sf2);padding:10px;border-radius:8px;overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="app" id="app">
  <header><h1>🚤 Lab</h1><div class="sub" id="hdr"></div><div class="modeTog" id="modeTog"><button data-m="focused">絞り込み</button><button data-m="std">15点</button></div></header>
  <div class="offline" id="offline">オフライン表示（最終取得時点のデータ）</div>
  <main id="main"></main>
</div>
<nav>
  <button data-v="home"><span>🏠</span>ホーム</button>
  <button data-v="races"><span>📋</span>レース</button>
  <button data-v="stats"><span>📈</span>成績</button>
  <button data-v="models"><span>🧪</span>モデル</button>
  <button data-v="settings"><span>⚙️</span>設定</button>
</nav>
<script>
const $ = (s, el=document) => el.querySelector(s);
const fmtP = v => v==null ? "–" : (v*100).toFixed(1)+"%";
const fmtY = v => v==null ? "–" : (v>=0?"+":"") + Math.round(v).toLocaleString() + "円";
const fmtN = v => v==null ? "–" : Math.round(v).toLocaleString();
const hhmm = s => s ? s.slice(11,16) : "";
let saved = {}; try { saved = JSON.parse(localStorage.getItem("bl_state") || "{}"); } catch (e) {}
const state = Object.assign({ view: "home", raceId: null, day: null, mode: "focused", statsBy: "month", statsStadium: "", statsRange: "all",
  f: { stadium: "", dec: "buy", res: "", cmin: 0, evmin: 0, sort: "time" } }, saved);
function persist() { try { localStorage.setItem("bl_state", JSON.stringify({ mode: state.mode, f: state.f, statsBy: state.statsBy })); } catch (e) {} }
const REASON = { confidence: "信頼度が基準未満", expected_return: "期待回収率が基準未満", incomplete: "データ未取得", low_agreement: "モデル不一致", no_value_points: "妙味のある買い目なし", odds_estimated: "実オッズ未取得" };
const MODE_ROLE = { std: "active", focused: "focused" };
const MODE_NAME = { std: "15点固定", focused: "絞り込み型" };
const mq = () => "mode=" + state.mode;

async function api(path, opt) {
  const r = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opt || {}));
  $("#offline").style.display = r.headers.get("X-From-Cache") ? "block" : "none";
  if (r.status === 401) { renderLogin(); throw new Error("auth"); }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function go(view, extra, opts) {
  if (view === "race" && state.view !== "race") { state.backView = state.view; state.backScroll = window.scrollY; if (!(opts && opts.pop)) history.pushState({ view: "race" }, ""); }
  state.view = view; Object.assign(state, extra || {}); persist();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  render().then(() => {
    if (view === "race") window.scrollTo(0, 0);
    else if (state.backScroll != null && view === state.backView) { window.scrollTo(0, state.backScroll); state.backScroll = null; }
  });
}
function goBack() { if (history.state && history.state.view === "race") history.back(); else go(state.backView || "races"); }
window.addEventListener("popstate", () => { if (state.view === "race") go(state.backView || "races", null, { pop: true }); });
function setMode(m) { state.mode = m; persist(); render(); }
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.v));
document.querySelectorAll("#modeTog button").forEach(b => b.onclick = () => setMode(b.dataset.m));

async function render() {
  document.querySelectorAll("#modeTog button").forEach(b => b.classList.toggle("on", b.dataset.m === state.mode));
  const hdr = document.querySelector("header"); if (hdr) document.documentElement.style.setProperty("--hdr", hdr.offsetHeight + "px");
  const m = $("#main"); m.innerHTML = '<p class="muted">読み込み中…</p>';
  try {
    if (state.view === "home") await renderHome(m);
    else if (state.view === "races") await renderRaces(m);
    else if (state.view === "race") await renderRace(m);
    else if (state.view === "stats") await renderStats(m);
    else if (state.view === "models") await renderModels(m);
    else if (state.view === "settings") await renderSettings(m);
  } catch (e) { if (e.message !== "auth") m.innerHTML = `<div class="card">エラー: ${e.message}</div>`; }
}
function renderLogin() {
  $("#main").innerHTML = `<div class="login card"><h2>ログイン</h2><input id="pw" type="password" placeholder="パスワード" autocomplete="current-password"><p><button class="btn" id="lg">ログイン</button></p></div>`;
  $("#lg").onclick = async () => { const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }) }); if (r.ok) render(); else alert("パスワードが違います"); };
}
function kpi(label, val, cls="") { return `<div class="kpi"><b class="${cls}">${val}</b><span>${label}</span></div>`; }
function planText(r) {
  if (!r.prediction_id) return "";
  if (state.mode === "focused") return r.n_points ? `${r.n_points}点 ${fmtN(r.stake_plan)}円` : "候補なし";
  return `15点 ${fmtN(r.stake_plan || 3000)}円`;
}
function raceRow(r) {
  const dec = r.decision ? `<span class="pill ${r.decision}">${r.decision === "buy" ? "推奨" : "見送り"}</span>` : `<span class="pill">未予想</span>`;
  const res = r.valid ? `<span class="pill ${r.hit ? "hit" : "miss"}">${r.hit ? "🎯 " + fmtY(r.pnl) : "外れ"}</span>` : (r.trifecta ? `<span class="pill">${r.trifecta}</span>` : "");
  return `<div class="row" onclick="go('race',{raceId:${r.id}})"><div class="t"><b>${r.stadium} ${r.race_no}R</b> <small>締切 ${hhmm(r.closed_at)}・${r.grade || ""} ${r.race_type || ""}${r.stage === "program" ? "・暫定" : ""}</small>
    <div class="bar" style="margin-top:4px"><i style="width:${Math.round((r.confidence || 0) * 100)}%"></i></div></div>
    <div class="right"><div class="mono">${fmtP(r.confidence)}</div><div class="muted mono">EV ${r.expected_return != null ? r.expected_return.toFixed(2) : "–"}</div><div class="muted">${planText(r)}</div></div><div class="right">${dec}<br>${res}</div></div>`;
}
async function renderHome(m) {
  const [t, s, rd, h] = await Promise.all([api("/api/today?" + mq()), api("/api/stats?" + mq()), api("/api/readiness?" + mq()), api("/api/health")]);
  $("#hdr").textContent = t.date + (t.active_model ? " · Model " + t.active_model : " · モデル未採用");
  const d = t.day, cum = s.buy, r100 = s.recent100_buy;
  m.innerHTML = `
    <p class="muted">表示中の買い方：<b>${MODE_NAME[state.mode]}</b>${state.mode === "focused" ? "（自信上位・期待値1.0以上・最大5点、1レース最大3,000円）" : "（本線10点＋穴5点、3,000円）"}</p>
    <div class="kpis">${kpi("レース数", t.n_races)}${kpi("推奨", t.n_buy)}${kpi("見送り", t.n_skip)}</div>
    <h2>今日の勝負レース <a href="#" class="muted" style="font-weight:400;float:right" onclick="state.f.dec='buy';go('races');return false">推奨をすべて見る ›</a></h2><div class="card">${t.top.length ? t.top.map(raceRow).join("") : '<p class="muted">推奨レースはまだありません（予想は締切前に確定します）</p>'}</div>
    <div class="tabs">${[...new Map(t.races.map(r => [r.stadium_code, r.stadium])).entries()].sort((a, b) => a[0] - b[0]).map(([c, n]) => `<button onclick="state.f.stadium='${c}';state.f.dec='all';go('races')">${n} ${t.races.filter(r => r.stadium_code === c && r.decision === "buy").length ? "★" : ""}</button>`).join("")}</div>
    <p class="muted">場をタップするとその場の全レース（推奨・見送りとも）を一覧で開きます。★＝推奨あり</p>
    <h2>本日の仮想収支（推奨のみ）</h2><div class="kpis">${kpi("投資", fmtN(d.stake)+"円")}${kpi("払戻", fmtN(d.payout)+"円")}${kpi("損益", fmtY(d.payout - d.stake), d.payout - d.stake >= 0 ? "pos" : "neg")}</div>
    <p class="muted">見送り含む全レース仮想：${d.virtual_hits}/${d.n} 的中、${fmtY(d.virtual_payout - d.virtual_stake)}</p>
    <h2>累計（推奨レース）</h2><div class="kpis">${kpi("レース", cum.n)}${kpi("的中率", fmtP(cum.hit_rate))}${kpi("回収率", fmtP(cum.roi), (cum.roi || 0) >= 1 ? "pos" : "")}</div>
    <div class="kpis" style="margin-top:8px">${kpi("直近100 的中率", fmtP(r100.hit_rate))}${kpi("直近100 回収率", fmtP(r100.roi))}${kpi("累計損益", fmtY(cum.pnl), cum.pnl >= 0 ? "pos" : "neg")}</div>
    <h2>実戦投入判定（${MODE_NAME[state.mode]}）</h2>${readinessCard(rd)}
    <h2>システム状態</h2><div class="card muted">採用モデル: ${h.active_model || "なし"}<br>直近ジョブ: ${h.jobs.slice(0,3).map(j => `${j.job.split(":")[0]} ${j.ok ? "✓" : (j.ok === false ? "✗" : "…")}`).join(" / ") || "なし"}<br>取得失敗(7日): ${h.fetch_failures_7d.map(f => f.source + " " + f.n).join(", ") || "0"}</div>`;
}
function readinessCard(rd) {
  const rows = rd.checks.map(c => `<tr><td>${c.name}</td><td class="n">${c.fmt === "pct" ? fmtP(c.value) : fmtN(c.value)}</td><td class="n">${c.fmt === "pct" ? fmtP(c.target) : fmtN(c.target)}</td><td>${c.ok ? "✅" : "—"}</td></tr>`).join("");
  return `<div class="card judge ${rd.passed ? "ok" : "ng"}"><table><tr><th>条件</th><th class="n">現在</th><th class="n">目標</th><th></th></tr>${rows}</table>
    <p><b>判定：${rd.passed ? "実戦投入条件クリア" : "実戦投入条件：未達"}</b></p>${rd.warnings.map(w => `<p class="pill warn" style="white-space:normal">⚠ ${w}</p>`).join("")}<p class="muted">${rd.note}</p></div>`;
}
// ---------------- レース一覧（絞り込み・並べ替え）
async function renderRaces(m) {
  const t = await api("/api/today?" + mq() + (state.day ? "&d=" + state.day : ""));
  $("#hdr").textContent = t.date;
  const f = state.f;
  const stadiums = [...new Map(t.races.map(r => [r.stadium_code, r.stadium])).entries()].sort((a, b) => a[0] - b[0]);
  let list = t.races.filter(r => (!f.stadium || r.stadium_code === +f.stadium)
    && (f.dec === "all" || (f.dec === "buy" ? r.decision === "buy" : r.decision === "skip"))
    && (!f.res || (f.res === "hit" ? r.valid && r.hit : f.res === "miss" ? r.valid && !r.hit : !r.valid))
    && ((r.confidence || 0) >= f.cmin) && ((r.expected_return || 0) >= f.evmin));
  const key = { time: r => r.closed_at || "", conf: r => -(r.confidence || 0), ev: r => -(r.expected_return || 0), pnl: r => -(r.pnl || 0) }[f.sort];
  list = list.slice().sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0);
  const setF = (k, v) => { state.f[k] = v; persist(); render(); };
  window.setF = setF;
  const stake = list.filter(r => r.valid).reduce((a, r) => a + (r.stake_total || 0), 0), pay = list.filter(r => r.valid).reduce((a, r) => a + (r.payout_total || 0), 0);
  m.innerHTML = `<div class="filt">
    <div class="tabs"><input type="date" value="${t.date}" style="width:auto;padding:4px 8px;min-height:32px" onchange="go('races',{day:this.value})">
      <button class="${!f.stadium ? "on" : ""}" onclick="setF('stadium','')">全場</button>${stadiums.map(([c, n]) => `<button class="${+f.stadium === c ? "on" : ""}" onclick="setF('stadium','${c}')">${n}</button>`).join("")}</div>
    <div class="tabs">${[["buy", "推奨"], ["skip", "見送り"], ["all", "全部"]].map(([k, l]) => `<button class="${f.dec === k ? "on" : ""}" onclick="setF('dec','${k}')">${l}</button>`).join("")}
      <span style="width:8px"></span>${[["", "結果:全"], ["hit", "的中"], ["miss", "外れ"], ["pending", "未確定"]].map(([k, l]) => `<button class="${f.res === k ? "on" : ""}" onclick="setF('res','${k}')">${l}</button>`).join("")}
      <span style="width:8px"></span>${[["time", "締切順"], ["conf", "信頼度順"], ["ev", "期待値順"], ["pnl", "損益順"]].map(([k, l]) => `<button class="${f.sort === k ? "on" : ""}" onclick="setF('sort','${k}')">${l}</button>`).join("")}</div>
    <div class="rng"><div>信頼度 ≥ <b class="mono">${fmtP(f.cmin)}</b><input type="range" min="0" max="0.9" step="0.05" value="${f.cmin}" onchange="setF('cmin',+this.value)"></div>
      <div>期待値 ≥ <b class="mono">${f.evmin.toFixed(2)}</b><input type="range" min="0" max="1.5" step="0.05" value="${f.evmin}" onchange="setF('evmin',+this.value)"></div></div></div>
    <p class="muted">${list.length}レース${stake ? ` · 確定分 投資${fmtN(stake)}円 / 払戻${fmtN(pay)}円 / 回収率${fmtP(pay / stake)}` : ""}</p>
    <div class="card">${list.length ? list.map(raceRow).join("") : '<p class="muted">該当なし</p>'}</div>`;
}
// ---------------- レース詳細（フォーメーション表示）
function formationView(sels, won) {
  // 1着→2着→3着の順に並べ、(1着,2着) ごとに3着をまとめる（フォーメーション/流しで買うときの入力順）
  const byKey = new Map();
  for (const s of sels) {
    const [a, b, c] = s.combo.split("-").map(Number);
    const k = a * 10 + b;
    if (!byKey.has(k)) byKey.set(k, { a, b, thirds: [] });
    byKey.get(k).thirds.push({ c, stake: s.stake, combo: s.combo, kind: s.kind });
  }
  const rows = [...byKey.values()].sort((x, y) => x.a - y.a || x.b - y.b);
  const firsts = [...new Set(sels.map(s => +s.combo[0]))].sort(), seconds = [...new Set(sels.map(s => +s.combo[2]))].sort(), thirds = [...new Set(sels.map(s => +s.combo[4]))].sort();
  const full = firsts.length * seconds.length * thirds.length;
  const lane = n => `<span class="lane l${n}">${n}</span>`;
  let html = `<div class="form">` + rows.map(r => {
    r.thirds.sort((x, y) => x.c - y.c);
    const total = r.thirds.reduce((a, t) => a + t.stake, 0);
    const uniform = r.thirds.every(t => t.stake === r.thirds[0].stake);
    return `<div class="fl"><div class="lanes">${lane(r.a)}</div><span class="arrow">→</span><div><div class="lanes" style="display:inline-flex;vertical-align:middle">${lane(r.b)}</div> <span class="arrow">→</span> <span class="thirds">${r.thirds.map(t => `<span class="${won === t.combo ? "won" : ""}">${t.c}${uniform ? "" : `<small>(${t.stake})</small>`}</span>`).join("")}</span></div><div class="amt">${r.thirds.length}点<br>${uniform ? r.thirds[0].stake + "円×" + r.thirds.length : fmtN(total) + "円"}</div></div>`;
  }).join("") + `</div>`;
  html += `<p class="muted" style="margin-top:8px">フォーメーション入力の目安：1着 <b>${firsts.join(",")}</b> ／ 2着 <b>${seconds.join(",")}</b> ／ 3着 <b>${thirds.join(",")}</b>${full === sels.length ? `（この組合せで${full}点＝上と同一）` : `（総当たり${full}点のうち${sels.length}点を購入。上の表のとおり点ごとに選ぶ）`}</p>`;
  return html;
}
async function renderRace(m) {
  const d = await api("/api/races/" + state.raceId);
  const r = d.race, role = MODE_ROLE[state.mode];
  const p = d.predictions.find(x => x.stage === "final" && x.role === role) || d.predictions.find(x => x.role === role) || d.predictions.find(x => x.stage === "final" && x.role === "active") || d.predictions[0];
  const other = d.predictions.find(x => x.stage === "final" && x.role === (role === "active" ? "focused" : "active"));
  const prog = d.predictions.find(x => x.stage === "program" && x.role === "active");
  $("#hdr").textContent = `${r.stadium} ${r.race_no}R`;
  const c = d.conditions;
  let html = `<p><button class="btn ghost" onclick="goBack()">‹ 戻る</button></p>
    <div class="card"><b>${r.stadium} ${r.race_no}R</b> ${r.grade || ""} ${r.race_type || ""}<br><span class="muted">締切 ${r.closed_at ? r.closed_at.replace("T"," ").slice(0,16) : "–"}${c ? ` · ${c.weather || ""} 風${c.wind_dir || ""}${c.wind_speed_m ?? "–"}m 波${c.wave_cm ?? "–"}cm 水温${c.water_temp_c ?? "–"}℃` : ""}</span></div>`;
  if (r.trifecta) {
    const sc = p && p.scoring;
    html += `<div class="card judge ${sc && sc.hit ? "ok" : "ng"}"><h3>結果</h3><b class="mono" style="font-size:22px">${r.trifecta}</b> <span class="muted">${r.kimarite || ""} 払戻 ${fmtN(r.trifecta_payout)}円${r.is_irregular ? "（返還等あり）" : ""}</span>
      ${sc ? `<p>${sc.valid ? (sc.hit ? `🎯 的中！` : "外れ") : "無効: " + sc.invalid_reason}<br>投資 ${fmtN(sc.stake_total)}円 / 払戻 ${fmtN(sc.payout_total)}円 / 損益 ${fmtY(sc.pnl)} / 回収率 ${fmtP(sc.roi)}${p.decision === "skip" ? "<br><span class='muted'>見送りレース（仮に購入していた場合）</span>" : ""}</p>` : ""}</div>`;
  }
  if (p) {
    const est = p.flags && p.flags.odds_estimated, isF = p.role === "focused";
    const total = p.selections.reduce((a, s) => a + s.stake, 0);
    html += `<div class="card judge ${p.decision === "buy" ? "ok" : ""}"><div class="kpis">${kpi("信頼度", fmtP(p.confidence))}${kpi(isF ? "期待値(加重)" : "期待回収率", p.expected_return != null ? p.expected_return.toFixed(2) : "–")}${kpi(p.decision === "buy" ? "推奨" : "見送り", p.decision === "buy" ? `${p.selections.length}点 ${fmtN(total)}円` : (REASON[p.skip_reason] || p.skip_reason || ""))}</div>
      <p class="muted">${MODE_NAME[isF ? "focused" : "std"]} · ${p.stage === "final" ? "確定予想" : "暫定予想（出走表のみ）"} · ${p.created_at.replace("T"," ").slice(0,16)} · データ完全性 ${fmtP(p.completeness)}${est ? " · <span class='pill warn'>オッズは推定値</span>" : ""}${isF && p.flags.S15 != null ? ` · 自信 ${fmtP(p.flags.S15)}` : ""}</p></div>`;
    const won = r.trifecta;
    if (p.selections.length) {
      html += `<div class="card"><h3>買い目（フォーメーション順）${p.decision === "skip" ? " <span class='pill skip'>見送り・参考</span>" : ""}</h3>${formationView(p.selections, won)}
        <details><summary>一覧で見る（確率・オッズ・期待値）</summary><div class="tbl"><table><tr><th>組</th><th class="n">金額</th><th class="n">確率</th><th class="n">オッズ</th><th class="n">期待値</th></tr>${p.selections.map(s => `<tr class="${won === s.combo ? "won" : ""}"><td class="mono">${s.combo}${s.kind === "hole" ? " <small class='muted'>穴</small>" : ""}${won === s.combo ? " 🎯" : ""}</td><td class="n">${s.stake}円</td><td class="n">${fmtP(s.prob)}</td><td class="n">${s.odds != null ? s.odds.toFixed(1) : "–"}</td><td class="n">${s.ev != null ? s.ev.toFixed(2) : "–"}</td></tr>`).join("")}</table></div></details>
        <p class="right muted">合計 ${fmtN(total)}円</p></div>`;
    } else {
      html += `<div class="card muted">この買い方では該当する買い目がありません（${REASON[p.skip_reason] || p.skip_reason || ""}）。</div>`;
    }
    if (other) html += `<p class="muted">もう一方（${MODE_NAME[other.role === "focused" ? "focused" : "std"]}）：${other.decision === "buy" ? "推奨" : "見送り"} · ${other.selections.length}点 ${fmtN(other.selections.reduce((a, s) => a + s.stake, 0))}円${other.scoring && other.scoring.valid ? ` · ${other.scoring.hit ? "的中 " : "外れ "}${fmtY(other.scoring.pnl)}` : ""}　<a href="#" onclick="setMode('${other.role === "focused" ? "focused" : "std"}');return false">切替</a></p>`;
    html += `<div class="card"><h3>根拠</h3><p>${p.rationale_text || ""}</p><p class="muted">軸 ${p.rationale.axis_lane}号艇 1着確率 ${fmtP(p.rationale.axis_p_win)}・軸の3連単総確率 ${fmtP(p.rationale.axis_trifecta_mass)}・本線合計 ${fmtP(p.rationale.main_mass)}・穴合計 ${fmtP(p.rationale.hole_mass)}</p></div>`;
    const be = p.boat_eval;
    html += `<div class="card"><h3>6艇評価</h3>` + Object.keys(be).sort().map(k => { const b = be[k]; return `<div class="boat"><div class="lane l${k}">${k}</div><div><b>${b.name || ""}</b> <span class="muted">${b.klass || ""} 進入${b.course_pred}</span><br><span class="muted">勝率${b.nat_win_rate ?? "–"} 当地${b.loc_win_rate ?? "–"} ST${b.avg_st ?? "–"} 機${b.motor_rate2 ?? "–"}% 展示${b.exhibition_time ?? "–"}(${b.exhibition_rank ?? "–"}位) 展示ST${b.st_exh ?? "–"}<br>コース別1着率(2年) ${fmtP(b.course_win_rate_2y)} n=${b.course_n_2y ?? 0} · 当地同コース ${fmtP(b.stadium_course_win_rate)} n=${b.stadium_course_n ?? 0} · 場基準 ${fmtP(b.stadium_course_base_1y)}</span></div><div class="right mono">${fmtP(b.p_win)}<br><small class="muted">${fmtP(b.p_top3)}</small></div></div>`; }).join("") + `</div>`;
    const top = Object.entries(p.probs).sort((a, b) => b[1] - a[1]);
    html += `<div class="card"><details><summary>120通りの評価を見る</summary><div class="tbl"><table><tr><th>組</th><th class="n">確率</th><th class="n">オッズ</th><th class="n">期待値</th></tr>${top.map(([k, v]) => `<tr><td class="mono">${k}</td><td class="n">${fmtP(v)}</td><td class="n">${p.odds_used[k] != null ? p.odds_used[k].toFixed(1) : "–"}</td><td class="n">${(p.ev[k] || 0).toFixed(2)}</td></tr>`).join("")}</table></div></details></div>`;
    if (prog && p.stage === "final") html += `<p class="muted">暫定予想（出走表のみ）: 信頼度 ${fmtP(prog.confidence)} / 期待回収率 ${fmtP(prog.expected_return)} / ${prog.decision === "buy" ? "推奨" : "見送り"}</p>`;
  } else {
    html += `<div class="card"><h3>出走表</h3>` + d.entries.map(e => `<div class="boat"><div class="lane l${e.lane}">${e.lane}</div><div><b>${e.name || ""}</b> <span class="muted">${e.klass || ""} 勝率${e.nat_win_rate ?? "–"} 当地${e.loc_win_rate ?? "–"} ST${e.avg_st ?? "–"} 機${e.motor_rate2 ?? "–"}%</span></div><div></div></div>`).join("") + `<p class="muted">予想はまだありません。</p></div>`;
  }
  m.innerHTML = html;
}
// ---------------- 成績
async function renderStats(m) {
  const stq = state.statsStadium ? "&stadium=" + state.statsStadium : "";
  const [s, bd, cal, sts] = await Promise.all([api(`/api/stats?${mq()}&range=${state.statsRange}${stq}`), api(`/api/stats/breakdown?${mq()}&by=${state.statsBy}${stq}`), api("/api/stats/calibration?" + mq()), api("/api/stadiums")]);
  const by = state.statsBy, b = s.buy, v = s.all_virtual;
  const tabs = [["month", "月別"], ["stadium", "場別"], ["grade", "グレード"], ["odds_band", "オッズ帯"], ["confidence_band", "信頼度帯"], ["kind", "本線/穴"], ["model_version", "モデル"]];
  const cols = bd.length ? Object.keys(bd[0]) : [];
  m.innerHTML = `<p class="muted">${MODE_NAME[state.mode]}の成績</p>
    <div class="two"><select onchange="go('stats',{statsStadium:this.value})"><option value="">全場</option>${sts.map(x => `<option value="${x.code}" ${+state.statsStadium === x.code ? "selected" : ""}>${x.name}</option>`).join("")}</select>
      <select onchange="go('stats',{statsRange:this.value})">${[["all", "全期間"], ["m", "今月"], ["w", "直近7日"], ["d", "今日"]].map(([k, l]) => `<option value="${k}" ${state.statsRange === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <h2>累計（推奨レース）</h2><div class="kpis">${kpi("レース", b.n)}${kpi("的中率", fmtP(b.hit_rate))}${kpi("回収率", fmtP(b.roi), (b.roi || 0) >= 1 ? "pos" : "")}${kpi("損益", fmtY(b.pnl), b.pnl >= 0 ? "pos" : "neg")}${kpi("最大連敗", b.max_losing_streak)}${kpi("最大DD", fmtN(b.max_drawdown) + "円")}</div>
    <p class="muted">的中率95%区間 ${b.hit_rate_ci ? b.hit_rate_ci.map(fmtP).join("〜") : "–"} · 回収率95%区間 ${b.roi_ci ? b.roi_ci.map(fmtP).join("〜") : "–"}${state.mode === "std" ? ` · 本線的中 ${b.main_hits} / 穴的中 ${b.hole_hits} · 穴回収率 ${fmtP(b.hole_roi)}` : ` · 平均投資 ${b.n ? fmtN(b.stake / b.n) : "–"}円/R`}</p>
    <h2>直近</h2><div class="kpis">${[50, 100, 200, 500].map(n => kpi(`直近${n}`, `${fmtP(s["recent" + n + "_buy"].hit_rate)} / ${fmtP(s["recent" + n + "_buy"].roi)}`)).join("")}</div>
    <h2>見送りの検証</h2><div class="card muted">全レース仮想：${v.n}R 的中率 ${fmtP(v.hit_rate)} 回収率 ${fmtP(v.roi)}<br>見送り ${s.n_skip}R のうち的中していたもの ${s.skip_would_hit}（見送り正解 ${s.skip_correct}）</div>
    <h2>内訳</h2><div class="tabs">${tabs.map(([k, l]) => `<button class="${by === k ? "on" : ""}" onclick="go('stats',{statsBy:'${k}'})">${l}</button>`).join("")}</div>
    <div class="card tbl">${bd.length ? `<table><tr>${cols.map(c => `<th class="${typeof bd[0][c] === "number" ? "n" : ""}">${c}</th>`).join("")}</tr>${bd.map(r => `<tr>${cols.map(c => `<td class="${typeof r[c] === "number" ? "n" : ""}">${typeof r[c] === "number" ? (c.includes("rate") || c.includes("roi") ? fmtP(r[c]) : fmtN(r[c])) : (r[c] ?? "")}</td>`).join("")}</tr>`).join("")}</table>` : '<p class="muted">データなし</p>'}</div>
    <h2>信頼度の校正（予測 vs 実績）</h2><div class="card tbl"><table><tr><th>信頼度帯</th><th class="n">n</th><th class="n">予測平均</th><th class="n">実績的中率</th></tr>${cal.map(r => `<tr><td>${r.band}</td><td class="n">${r.n}</td><td class="n">${fmtP(r.conf_mean)}</td><td class="n">${fmtP(r.hit_rate)}</td></tr>`).join("")}</table></div>`;
}
async function renderModels(m) {
  const [ms, bt] = await Promise.all([api("/api/models"), api("/api/backtests")]);
  m.innerHTML = `<h2>モデル版</h2><div class="card">${ms.map(x => `<div class="row" style="cursor:default"><div class="t"><b>Model ${x.version}</b> <span class="pill ${x.status === "active" ? "buy" : ""}">${x.status}</span><small>${x.description || ""} · 学習 〜${x.trained_until || "–"}</small></div>${x.status !== "active" ? `<button class="btn ghost" onclick="if(confirm('Model ${x.version} を採用しますか？'))api('/api/models/${x.version}/activate',{method:'POST'}).then(()=>render())">採用</button> <button class="btn ghost" onclick="api('/api/models/${x.version}/status',{method:'POST',body:JSON.stringify({status:'${x.status === "shadow" ? "candidate" : "shadow"}'})}).then(()=>render())">${x.status === "shadow" ? "並走停止" : "並走"}</button>` : ""}</div>`).join("") || '<p class="muted">未登録</p>'}</div>
    <h2>バックテスト</h2>${Object.entries(bt).map(([k, v]) => `<div class="card"><details><summary>${k}</summary><pre class="md">${v.replace(/</g, "&lt;")}</pre></details></div>`).join("") || '<p class="muted">レポートなし</p>'}`;
}
// ---------------- 設定
async function renderSettings(m) {
  const s = await api("/api/settings");
  const rd = s.readiness, ex = s.extra || {};
  const stk = ex.staking || { method: "uniform" };
  const fc = Object.assign({ enabled: true, s15_min: 0.73, ev_min: 1.0, odds_lo: 5, odds_hi: 50, max_points: 5, cap: 1000, budget: 3000, power: 1.0, completeness_min: 0.6, require_real_odds: false }, ex.focused || {});
  const rf = Object.assign({ min_races: 500, roi: 1.0, roi_ci_lower: 0.95, recent_n: 100, recent_roi: 1.0 }, ex.readiness_focused || {});
  const num = (id, label, v, step, extra="") => `<label>${label}<input id="${id}" type="number" step="${step}" value="${v}" ${extra}></label>`;
  m.innerHTML = `<h2>絞り込み型の買い方</h2><div class="card">
      <label>有効<select id="fc_enabled"><option value="1" ${fc.enabled ? "selected" : ""}>毎日保存する</option><option value="0" ${!fc.enabled ? "selected" : ""}>停止</option></select></label>
      <div class="two">${num("fc_s15", "自信の下限（上位15点の確率和）", fc.s15_min, 0.01)}${num("fc_ev", "期待値の下限", fc.ev_min, 0.05)}</div>
      <div class="two">${num("fc_olo", "オッズ下限（倍）", fc.odds_lo, 1)}${num("fc_ohi", "オッズ上限（倍）", fc.odds_hi, 5)}</div>
      <div class="two">${num("fc_max", "最大点数", fc.max_points, 1, 'min="1" max="15"')}${num("fc_cap", "1点の上限（円）", fc.cap, 100)}</div>
      <div class="two">${num("fc_budget", "1レース予算（円）", fc.budget, 100)}${num("fc_power", "配分の指数（1=確率比例）", fc.power, 0.5)}</div>
      <label>実オッズが無いときは見送る<select id="fc_real"><option value="0" ${!fc.require_real_odds ? "selected" : ""}>推定オッズでも買い目を出す</option><option value="1" ${fc.require_real_odds ? "selected" : ""}>見送る</option></select></label>
      <p class="muted">検証期間（2024-01〜2025-06）ではこの既定値で対象20%・平均3点・回収率85.3%。値を変えると次の確定予想から適用され、過去の予想は変わりません。</p></div>
    <h2>実戦投入条件（絞り込み型）</h2><div class="card"><div class="two">${num("rf_min_races", "対象レース数", rf.min_races, 50)}${num("rf_roi", "累計回収率", rf.roi, 0.01)}</div>
      <div class="two">${num("rf_roi_ci_lower", "回収率95%区間の下限", rf.roi_ci_lower, 0.01)}${num("rf_recent_roi", "直近回収率", rf.recent_roi, 0.01)}</div>${num("rf_recent_n", "直近の本数", rf.recent_n, 10)}
      <p class="muted">「区間下限」を入れることで、たまたま調子が良かっただけの期間を実戦投入と誤認しにくくなります。</p></div>
    <h2>15点固定の購入候補条件</h2><div class="card"><label>信頼度（下限）<input id="cmin" type="number" step="0.01" value="${s.confidence_min}"></label><label>期待回収率（下限）<input id="emin" type="number" step="0.01" value="${s.ev_min}"></label><label>データ完全性（下限）<input id="cpl" type="number" step="0.05" value="${s.completeness_min}"></label></div>
    <h2>実戦投入条件（15点固定）</h2><div class="card">${Object.entries(rd).map(([k, v]) => `<label>${k}<input id="rd_${k}" type="number" step="0.01" value="${v}"></label>`).join("")}</div>
    <h2>15点固定の資金配分（合計 ${(s.points * s.stake_per_point).toLocaleString()}円）</h2><div class="card">
      <label>方式<select id="stk_method">${[["uniform","均等（200円×15点）"],["prob","確率比例（本線上位に厚く）"],["payout_equal","払戻均等（オッズ反比例）"],["group","本線/穴で単価を変える"]].map(([k,v]) => `<option value="${k}" ${stk.method === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <div class="two">${num("stk_power", "確率比例の指数", stk.prob_power ?? 1, 0.5)}${num("stk_max", "1点の上限（割合）", stk.max_share ?? 0.3, 0.05)}</div>
      <div class="two">${num("stk_main", "本線1点（group）", stk.main_stake ?? 100, 100)}${num("stk_hole", "穴1点（group）", stk.hole_stake ?? 400, 100)}</div></div>
    <p><button class="btn" id="save">保存（新しい設定版として記録）</button></p><p class="muted">変更は設定版として記録され、過去の予想には影響しません。</p>`;
  $("#save").onclick = async () => {
    const g = id => +$("#" + id).value;
    const staking = { method: $("#stk_method").value, prob_power: g("stk_power"), max_share: g("stk_max"), main_stake: g("stk_main"), hole_stake: g("stk_hole"), min_per_point: 100, unit: 100 };
    const focused = { enabled: $("#fc_enabled").value === "1", s15_min: g("fc_s15"), ev_min: g("fc_ev"), odds_lo: g("fc_olo"), odds_hi: g("fc_ohi"), max_points: g("fc_max"), cap: g("fc_cap"), budget: g("fc_budget"), power: g("fc_power"), completeness_min: fc.completeness_min, require_real_odds: $("#fc_real").value === "1", pool: 15, beta: 0 };
    const readiness_focused = { min_races: g("rf_min_races"), roi: g("rf_roi"), roi_ci_lower: g("rf_roi_ci_lower"), recent_n: g("rf_recent_n"), recent_roi: g("rf_recent_roi") };
    const body = { confidence_min: g("cmin"), ev_min: g("emin"), completeness_min: g("cpl"), readiness: Object.fromEntries(Object.keys(rd).map(k => [k, g("rd_" + k)])), extra: Object.assign({}, ex, { staking, focused, readiness_focused }) };
    await api("/api/settings", { method: "PUT", body: JSON.stringify(body) }); alert("保存しました"); render();
  };
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
go("home");
