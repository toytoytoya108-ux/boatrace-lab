[project]
name = "boatlab"
version = "0.1.0"
description = "ボートレース 3連単 予想・統計分析・バックテスト・ペーパートレード基盤"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "httpx>=0.27",
  "tenacity>=8",
  "typer>=0.12",
  "pandas>=2",
  "pyarrow>=15",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4",
  "duckdb>=1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3"]

[project.scripts]
lab = "boatlab.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["boatlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
